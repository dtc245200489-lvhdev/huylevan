services:
  db:
    image: postgres:16-alpine
    container_name: recipe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RecipeDB_ChangeMe_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_user -d recipes"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]

  web:
    build: ./app
    container_name: recipe-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://recipe_user:${POSTGRES_PASSWORD:-RecipeDB_ChangeMe_2026}@db:5432/recipes
      SECRET_KEY: ${SECRET_KEY:-local-practice-secret-change-me}
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    networks: [frontend, backend]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100

  nginx:
    image: nginx:1.27-alpine
    container_name: recipe-nginx
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx
      - /var/run

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: recipe-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin123!ChangeMe}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports: ["5050:80"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: recipe-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [web]
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: recipe-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Admin123!ChangeMe}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.2.1
    container_name: recipe-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.2.1
    container_name: recipe-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
