<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bếp Nhà{% endblock %}</title>
  <style>
    :root{--green:#276749;--cream:#fffaf0;--ink:#263238;--orange:#dd6b20}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    header{background:var(--green);color:white;padding:18px max(20px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    header a{color:white;text-decoration:none;font-weight:700}.brand{font-size:1.45rem}nav{display:flex;gap:18px}
    main{max-width:1050px;margin:28px auto;padding:0 20px}.hero{background:linear-gradient(120deg,#f6ad55,#fbd38d);border-radius:18px;padding:28px;margin-bottom:24px}
    .hero h1{margin:0 0 8px;font-size:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
    .card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;box-shadow:0 5px 18px #0000000b}
    .tag{display:inline-block;background:#c6f6d5;color:#22543d;border-radius:99px;padding:3px 10px;font-size:.85rem}
    .btn{display:inline-block;background:var(--green);color:white;padding:9px 14px;border-radius:8px;text-decoration:none;border:0;cursor:pointer;font:inherit}
    input,textarea,select{width:100%;padding:10px;border:1px solid #a0aec0;border-radius:8px;margin:5px 0 14px;font:inherit}
    label{font-weight:650}.flash{padding:10px 14px;border-radius:8px;background:#c6f6d5;margin:12px 0}.flash.error{background:#fed7d7}
    footer{text-align:center;color:#718096;padding:25px}small{color:#718096}.steps{white-space:pre-line}
  </style>
</head>
<body>
<header><a class="brand" href="/">🍲 Bếp Nhà</a><nav><a href="/">Công thức</a><a href="/add">＋ Thêm món</a></nav></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ 'error' if category == 'error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main><footer>Website thực hành triển khai hệ thống · Bếp Nhà</footer>
</body></html>
